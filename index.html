<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Voyages – Explorer le monde</title>

    <!-- Police Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Si tu utilises un framework CSS (Bootstrap, Tailwind…), ajoute son lien ICI, AVANT style.css -->
    <link rel="stylesheet" href="style.css" />

    <!-- defer : le script s'exécute une fois le HTML chargé -->
    <script src="script.js" defer></script>
  </head>
  <body>

    <header>
      <nav>
        <h1>Atlas Voyages</h1>
      </nav>
    </header>

    <section class="section-recherche">
      <div class="top-recheche">
        <h2>Explorer le monde</h2>
        <h3>Choisis un continent, parcours les pays et trouve ta prochaine destination.</h3>
      </div>
      <div class="recherche">

        <select name="" id="select" class="select">
          <option value="Default">Default</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
        </select>
        <input type="text" placeholder="Ex. : Morocco">

      </div>
    </section>

    <section class="cards-display" id="cards-display">
      
      
    </section>





  </body>
</html>
